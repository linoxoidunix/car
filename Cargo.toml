[workspace]
resolver = "2"
members = ["crates/cra-core", "crates/cra-cli", "crates/cra-server"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
license = "Proprietary"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cra-core = { path = "crates/cra-core" }

[profile.release]
lto = true
codegen-units = 1
